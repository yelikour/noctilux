name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run ruff
        run: ruff check src tests scripts

      - name: Check CLI help
        run: noctilux --help

      - name: List transforms
        run: noctilux list-transforms

      - name: Check preview help
        run: noctilux preview --help

      - name: Inspect preset config
        run: noctilux inspect-config --config configs/presets/all_basic_v021.yaml
