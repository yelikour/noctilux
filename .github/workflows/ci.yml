name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run ruff
        run: ruff check src tests scripts

      - name: Check CLI help
        run: noctilux --help

      - name: List transforms
        run: noctilux list-transforms

      - name: Check preview help
        run: noctilux preview --help

      - name: Preview smoke test
        run: |
          noctilux preview \
            --config configs/examples/full_v020.yaml \
            --image examples/images/sample.jpg \
            --output /tmp/noctilux_ci_preview.jpg \
            --max-pipelines 4 \
            --seed 42
          test -s /tmp/noctilux_ci_preview.jpg

      - name: Inspect preset config
        run: noctilux inspect-config --config configs/presets/all_basic_v021.yaml

      - name: Inspect quickstart sample config
        run: noctilux inspect-config --config configs/examples/quickstart_sample.yaml

      - name: Dry-run quickstart sample config
        run: noctilux run --config configs/examples/quickstart_sample.yaml --dry-run

      - name: Report smoke test
        run: |
          noctilux run --config configs/examples/quickstart_sample.yaml
          noctilux report \
            --metadata outputs/quickstart_sample/metadata \
            --output /tmp/noctilux_report.md
          test -s /tmp/noctilux_report.md

  opencv-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with OpenCV backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,opencv]"

      - name: Run OpenCV backend tests
        run: python -m pytest tests/test_opencv_backend.py

      - name: Run ruff
        run: ruff check src tests scripts

      - name: Inspect OpenCV backend config
        run: noctilux inspect-config --config configs/examples/opencv_backend.yaml

      - name: Dry-run OpenCV backend config
        run: noctilux run --config configs/examples/opencv_backend.yaml --dry-run
