project:
  name: noctilux_compression_robustness
  seed: 42
  description: "Compression robustness preset for generating codec variants."

input:
  mode: folder
  image_root: examples/images
  infer_label_from_subdir: true
  recursive: true

output:
  root: outputs/example_run
  preserve_subdirs: true
  overwrite: false
  save_format: jpg

runtime:
  dry_run: false
  num_workers: 1
  skip_broken_images: true
  fail_fast: false
  show_progress: true

pipelines:
  - name: jpeg_q95
    transforms:
      - name: jpeg_compression
        params:
          quality: 95
          subsampling: "4:4:4"
  - name: jpeg_q80
    transforms:
      - name: jpeg_compression
        params:
          quality: 80
          subsampling: "4:2:0"
  - name: jpeg_q60
    transforms:
      - name: jpeg_compression
        params:
          quality: 60
          subsampling: "4:2:0"
  - name: webp_q80
    transforms:
      - name: webp_compression
        params:
          quality: 80
  - name: double_jpeg_85_70
    transforms:
      - name: double_jpeg_compression
        params:
          quality1: 85
          quality2: 70
  - name: png_resave
    transforms:
      - name: png_resave
        params:
          compress_level: 6
