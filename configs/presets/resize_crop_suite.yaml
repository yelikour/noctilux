project:
  name: noctilux_resize_crop_suite
  seed: 42
  description: "Resize and crop preset suite for batch variant generation."

input:
  mode: folder
  image_root: examples/images
  infer_label_from_subdir: true
  recursive: true

output:
  root: outputs/example_run
  preserve_subdirs: true
  overwrite: false
  save_format: jpg

runtime:
  dry_run: false
  num_workers: 1
  skip_broken_images: true
  fail_fast: false
  show_progress: true

pipelines:
  - name: resize_long_512
    transforms:
      - name: resize_long_edge
        params:
          long_edge: 512
          interpolation: bicubic
  - name: resize_short_512
    transforms:
      - name: resize_short_edge
        params:
          short_edge: 512
          interpolation: bicubic
  - name: center_crop_075_resize_512
    transforms:
      - name: center_crop_ratio
        params:
          ratio: 0.75
      - name: resize_long_edge
        params:
          long_edge: 512
          interpolation: bicubic
  - name: random_crop_080_resize_512
    transforms:
      - name: random_crop_ratio
        params:
          ratio: 0.8
      - name: resize_long_edge
        params:
          long_edge: 512
          interpolation: bicubic
  - name: downscale_upscale_050
    transforms:
      - name: downscale_upscale
        params:
          scale: 0.5
          down_interpolation: bilinear
          up_interpolation: bicubic
